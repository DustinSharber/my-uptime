{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">{{ monitor.name }} - System Metrics</h1>
        <div class="flex gap-2">
            <a href="{{ url_for('main.monitor_detail', monitor_id=monitor.id) }}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">
                Back to Monitor
            </a>
            <div class="relative">
                <select id="timeRange" class="bg-white border border-gray-300 rounded px-4 py-2 appearance-none cursor-pointer" 
                        onchange="window.location.href = '{{ url_for('main.monitor_metrics', monitor_id=monitor.id) }}?hours=' + this.value">
                    <option value="24" {% if hours == 24 %}selected{% endif %}>Last 24 hours</option>
                    <option value="48" {% if hours == 48 %}selected{% endif %}>Last 48 hours</option>
                    <option value="72" {% if hours == 72 %}selected{% endif %}>Last 72 hours</option>
                    <option value="168" {% if hours == 168 %}selected{% endif %}>Last 7 days</option>
                </select>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- CPU Usage Chart -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4">CPU Usage</h2>
            <canvas id="cpuChart"></canvas>
        </div>
        
        <!-- Memory Usage Chart -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4">Memory Usage</h2>
            <canvas id="memoryChart"></canvas>
        </div>
        
        <!-- Disk Usage Chart -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4">Disk Usage</h2>
            <canvas id="diskChart"></canvas>
        </div>
        
        <!-- Network Usage Chart -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4">Network Usage</h2>
            <canvas id="networkChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const metrics = {{ metrics_json | safe }};
    const timestamps = metrics.map(m => new Date(m.timestamp * 1000).toLocaleString());
    
    // CPU Chart
    new Chart(document.getElementById('cpuChart'), {
        type: 'line',
        data: {
            labels: timestamps,
            datasets: [{
                label: 'CPU Usage %',
                data: metrics.map(m => m.cpu_percent),
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });
    
    // Memory Chart
    new Chart(document.getElementById('memoryChart'), {
        type: 'line',
        data: {
            labels: timestamps,
            datasets: [{
                label: 'Memory Usage %',
                data: metrics.map(m => m.memory_percent),
                borderColor: 'rgb(255, 99, 132)',
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });
    
    // Disk Chart
    new Chart(document.getElementById('diskChart'), {
        type: 'line',
        data: {
            labels: timestamps,
            datasets: [{
                label: 'Disk Usage %',
                data: metrics.map(m => m.disk_percent),
                borderColor: 'rgb(54, 162, 235)',
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });
    
    // Network Chart
    new Chart(document.getElementById('networkChart'), {
        type: 'line',
        data: {
            labels: timestamps,
            datasets: [
                {
                    label: 'Bytes Sent (MB)',
                    data: metrics.map(m => m.bytes_sent / (1024 * 1024)),
                    borderColor: 'rgb(153, 102, 255)',
                    tension: 0.1
                },
                {
                    label: 'Bytes Received (MB)',
                    data: metrics.map(m => m.bytes_recv / (1024 * 1024)),
                    borderColor: 'rgb(255, 159, 64)',
                    tension: 0.1
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
});
</script>
{% endblock %}
